name = "key-house"
main = "src/worker.ts"
compatibility_date = "2025-09-01"

[[durable_objects.bindings]]
name = "GAME_ROOM"
class_name = "GameRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

# At most 10 game creations (password attempts) per IP per minute.
[[ratelimits]]
name = "CREATE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[vars]
# Only the production site may call the HTTP API from a browser; several origins can be separated
# by commas. Local `wrangler dev` reads server/.dev.vars, which sets "*" so LAN phones keep working.
ALLOWED_ORIGIN = "https://game-ps.vercel.app"
